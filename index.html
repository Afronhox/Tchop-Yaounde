<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tchop Yaoundé | Good food, small budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="flag-stripe" aria-hidden="true"></div>
    <div class="wrap site-header__row">
      <a class="logo" href="#top">🍴 Tchop Yaoundé</a>
      <a class="header-search" href="#search-input" id="header-search">Search</a>
    </div>
  </header>

  <main id="top">

    <section class="hero">
      <div class="wrap">
        <h1>Good food.<br>Small budget.<br>No stress.</h1>
        <p class="hero__sub">Find a place to eat in Yaoundé for the price you can pay.</p>

        <form class="search" role="search" onsubmit="return false">
          <label class="visually-hidden" for="search-input">Search restaurants or dishes</label>
          <span class="search__icon" aria-hidden="true">🔍</span>
          <input id="search-input" type="search" placeholder="Search restaurants or dishes..." autocomplete="off">
        </form>
      </div>
    </section>

    <section class="browse">
      <div class="wrap">
        <div class="filters" role="group" aria-label="Filter restaurants">
          <button class="chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="budget" aria-pressed="false">Under 1500 F</button>
          <button class="chip" type="button" data-filter="traditional" aria-pressed="false">Traditional</button>
          <button class="chip" type="button" data-filter="chicken" aria-pressed="false">🍗 Chicken</button>
        </div>

        <div class="filters filters--area" role="group" aria-label="Filter by area">
          <button class="chip" type="button" data-filter="mvog-ada" aria-pressed="false">Mvog-Ada</button>
          <button class="chip" type="button" data-filter="yaounde" aria-pressed="false">Yaoundé</button>
          <button class="chip" type="button" data-filter="essos" aria-pressed="false">Essos</button>
          <button class="chip" type="button" data-filter="bastos" aria-pressed="false">Bastos</button>
          <button class="chip" type="button" data-filter="melen" aria-pressed="false">Melen</button>
          <button class="chip" type="button" data-filter="mokolo" aria-pressed="false">Mokolo</button>
          <button class="chip" type="button" data-filter="emana" aria-pressed="false">Emana</button>
          <button class="chip" type="button" data-filter="ngoa-ekelle" aria-pressed="false">Ngoa-Ekellé</button>
        </div>

        <p class="result-count" id="result-count" aria-live="polite"></p>

        <div class="grid" id="restaurant-grid"></div>

        <div class="empty" id="empty" hidden>
          <p>No restaurant matches that search.</p>
          <button class="btn" type="button" id="reset">Clear search and filters</button>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Tchop Yaoundé is a small guide to eating well on a budget.</p>
      <p>Prices change. Confirm with the restaurant before you go.</p>
    </div>
  </footer>

  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <div class="dialog__inner">
      <div class="dialog__head">
        <div>
          <h2 id="menu-title"></h2>
          <p id="menu-area" class="dialog__area"></p>
        </div>
        <button class="dialog__close" type="button" id="menu-close" aria-label="Close menu">✕</button>
      </div>
      <ul class="menu-list" id="menu-list"></ul>
      <p class="dialog__note" id="menu-note" hidden></p>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
