<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up - Tchop Yaoundé</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
  <header class="site-header">
    <div class="flag-stripe" aria-hidden="true"></div>
    <div class="wrap site-header__row">
      <a class="logo" href="index.html">🍴 Tchop Yaoundé</a>
      <nav class="header-nav">
        <a class="header-link" href="login.html">Login</a>
        <a class="header-link" href="signup.html">Sign up</a>
        <a class="header-link" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-wrap">
      <h1>Create an account</h1>
      <form id="signup-form" class="auth-form" onsubmit="return false">
        <div class="form-field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
        </div>
        <div class="auth-actions">
          <button id="signup-button" class="btn" type="submit">Create account</button>
          <div class="auth-note">Already have an account? <a href="login.html">Login</a></div>
        </div>
        <div id="signup-message" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const msg = document.getElementById('signup-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = 'Creating account...';
        msg.style.color = '';
        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.value.trim(), email: email.value.trim(), password: password.value })
          });
          const body = await res.json();
          if (!res.ok) {
            msg.textContent = body.error || 'Registration failed';
            msg.style.color = 'var(--tomato)';
            return;
          }
          msg.textContent = 'Account created — redirecting to login...';
          msg.style.color = 'var(--forest)';
          setTimeout(() => window.location = 'login.html', 900);
        } catch (err) {
          msg.textContent = 'Could not reach server. Make sure backend is running.';
          msg.style.color = 'var(--tomato)';
        }
      });
    });
  </script>
</body>
</html>
